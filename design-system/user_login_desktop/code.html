<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nexus Recruit - Sign In</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-container": "#0369a1",
                        "inverse-surface": "#213145",
                        "surface": "#f8f9ff",
                        "tertiary-fixed": "#ffdcc1",
                        "outline-variant": "#c0c7d1",
                        "secondary": "#006d30",
                        "on-secondary-container": "#007233",
                        "primary-fixed": "#cde5ff",
                        "on-tertiary-fixed": "#2e1500",
                        "surface-bright": "#f8f9ff",
                        "outline": "#707881",
                        "on-tertiary": "#ffffff",
                        "on-error": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-container": "#cbe4ff",
                        "secondary-fixed": "#95f8a7",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed-variant": "#6c3a00",
                        "error": "#ba1a1a",
                        "secondary-container": "#92f5a4",
                        "background": "#f8f9ff",
                        "on-secondary-fixed-variant": "#005323",
                        "primary-fixed-dim": "#94ccff",
                        "on-surface-variant": "#40474f",
                        "on-background": "#0b1c30",
                        "surface-container-high": "#dce9ff",
                        "on-primary-fixed-variant": "#004b74",
                        "surface-container-highest": "#d3e4fe",
                        "surface-container-low": "#eff4ff",
                        "surface-dim": "#cbdbf5",
                        "tertiary-fixed-dim": "#ffb878",
                        "on-error-container": "#93000a",
                        "surface-tint": "#006399",
                        "on-surface": "#0b1c30",
                        "on-primary-fixed": "#001d32",
                        "primary": "#00507d",
                        "on-tertiary-container": "#ffdbbe",
                        "surface-variant": "#d3e4fe",
                        "secondary-fixed-dim": "#79db8d",
                        "on-secondary": "#ffffff",
                        "inverse-on-surface": "#eaf1ff",
                        "surface-container": "#e5eeff",
                        "tertiary": "#733f00",
                        "inverse-primary": "#94ccff",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed": "#00210a",
                        "tertiary-container": "#955301"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "sidebar-width": "280px",
                        "gutter": "24px",
                        "sm": "8px",
                        "lg": "24px",
                        "xl": "32px",
                        "base": "4px",
                        "container-max": "1440px",
                        "md": "16px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Lexend"],
                        "label-md": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-md": ["Lexend"],
                        "body-lg": ["Inter"],
                        "display-lg": ["Lexend"],
                        "headline-lg-mobile": ["Lexend"],
                        "body-sm": ["Inter"],
                        "mono-sm": ["Inter"],
                        "label-sm": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "mono-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .filled-icon {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom Input Focus Ring */
        .input-focus-ring:focus {
            box-shadow: 0 0 0 2px rgba(0, 80, 125, 0.2);
            border-color: #00507d;
        }
    </style>
</head>
<body class="bg-[#F8FAFC] min-h-screen flex items-center justify-center font-body-md text-on-surface antialiased p-md">
<!-- Auth Container: 480px fixed-width container for focus -->
<main class="w-full max-w-[480px]">
<!-- Logo Header -->
<div class="text-center mb-xl">
<h1 class="text-headline-lg font-headline-lg text-primary tracking-tight">Nexus Recruit</h1>
<p class="text-body-md font-body-md text-on-surface-variant mt-sm">Enterprise Talent Acquisition</p>
</div>
<!-- Auth Card (Level 1 Surface) -->
<div class="bg-surface-container-lowest border border-[#E2E8F0] rounded-xl p-xl shadow-sm">
<!-- Title -->
<div class="mb-lg">
<h2 class="text-headline-md font-headline-md text-on-surface">Sign In</h2>
<p class="text-body-sm font-body-sm text-on-surface-variant mt-xs">Welcome back. Please enter your details.</p>
</div>
<form action="#" class="space-y-lg" method="POST">
<!-- Email Field -->
<div>
<label class="block text-label-md font-label-md text-on-surface mb-base" for="email">Email address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant text-body-lg">mail</span>
</div>
<input class="block w-full pl-xl pr-sm py-sm border border-[#E2E8F0] rounded-lg text-body-md font-body-md text-on-surface placeholder-outline-variant bg-surface-container-lowest focus:outline-none input-focus-ring transition-shadow" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex justify-between items-center mb-base">
<label class="block text-label-md font-label-md text-on-surface" for="password">Password</label>
<a class="text-label-sm font-label-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant text-body-lg">lock</span>
</div>
<input class="block w-full pl-xl pr-sm py-sm border border-[#E2E8F0] rounded-lg text-body-md font-body-md text-on-surface placeholder-outline-variant bg-surface-container-lowest focus:outline-none input-focus-ring transition-shadow" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Actions -->
<div class="pt-sm space-y-sm">
<!-- Primary Sign In -->
<button class="w-full flex justify-center py-sm px-md border border-transparent rounded-lg shadow-sm text-label-md font-label-md text-on-primary bg-primary hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all active:scale-[0.98]" type="submit">
                        Sign In
                    </button>
<!-- Divider -->
<div class="relative py-sm flex items-center">
<div class="flex-grow border-t border-[#E2E8F0]"></div>
<span class="flex-shrink-0 mx-sm text-label-sm font-label-sm text-outline-variant uppercase tracking-wider">Or continue with</span>
<div class="flex-grow border-t border-[#E2E8F0]"></div>
</div>
<!-- Secondary Google Login -->
<button class="w-full flex justify-center items-center py-sm px-md border border-[#E2E8F0] rounded-lg shadow-sm text-label-md font-label-md text-on-background bg-surface-container-lowest hover:bg-surface transition-all active:scale-[0.98]" type="button">
<!-- Inline SVG for Google Logo for aesthetic, since material icons doesn't have brand logos -->
<svg class="w-5 h-5 mr-sm" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                        Google
                    </button>
</div>
</form>
<!-- Register Link -->
<p class="mt-lg text-center text-body-sm font-body-sm text-on-surface-variant">
                Don't have an account? 
                <a class="font-label-md text-primary hover:text-primary-container transition-colors" href="#">Request Access</a>
</p>
</div>
<!-- Footer Meta -->
<div class="mt-lg text-center">
<p class="text-label-sm font-label-sm text-outline-variant">
                © 2024 Nexus Recruit. Secure Login Portal.
            </p>
</div>
</main>
</body></html>
