spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]

  application:
    name: smart-recruitment-portal

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:25MB}
      max-request-size: ${MAX_UPLOAD_SIZE:25MB}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    ignore-missing-migrations: true
    validate-on-migrate: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    com.sjp.recruitment: DEBUG
    org.springframework.security: INFO

management:
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

app:
  data-seeder:
    enabled: ${APP_DATA_SEEDER_ENABLED:false}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  backend-base-url: ${BACKEND_BASE_URL:http://localhost:8080/api}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
  mail-from: ${MAIL_FROM:no-reply@smart-recruitment.local}
  email-verification-token-ttl-minutes: ${EMAIL_VERIFICATION_TOKEN_TTL_MINUTES:1440}
  password-reset-token-ttl-minutes: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:30}
  oauth-role-selection-token-ttl-minutes: ${OAUTH_ROLE_SELECTION_TOKEN_TTL_MINUTES:15}
  auth-rate-limit:
    enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
    window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
    login-requests: ${AUTH_RATE_LIMIT_LOGIN_REQUESTS:10}
    register-requests: ${AUTH_RATE_LIMIT_REGISTER_REQUESTS:5}
    forgot-password-requests: ${AUTH_RATE_LIMIT_FORGOT_PASSWORD_REQUESTS:5}
    reset-password-requests: ${AUTH_RATE_LIMIT_RESET_PASSWORD_REQUESTS:10}
    resend-verification-requests: ${AUTH_RATE_LIMIT_RESEND_VERIFICATION_REQUESTS:3}
  ai-interview:
    gladia-api-key: ${GLADIA_API_KEY:}
    gladia-base-url: ${GLADIA_BASE_URL:https://api.gladia.io}
    shopaikey-api-key: ${SHOPAIKEY_API_KEY:}
    shopaikey-base-url: ${SHOPAIKEY_BASE_URL:https://api.shopaikey.com/v1}
    shopaikey-model: ${SHOPAIKEY_MODEL:gpt-4.1-mini}
    shopaikey-tts-model: ${SHOPAIKEY_TTS_MODEL:gpt-4o-mini-tts}
    shopaikey-tts-voice: ${SHOPAIKEY_TTS_VOICE:coral}
    shopaikey-tts-format: ${SHOPAIKEY_TTS_FORMAT:mp3}
    shopaikey-tts-instructions: ${SHOPAIKEY_TTS_INSTRUCTIONS:Đọc tiếng Việt rõ ràng, lưu loát, tốc độ vừa phải, giọng thân thiện và chuyên nghiệp của người phỏng vấn.}
    audio-max-seconds: ${AI_INTERVIEW_AUDIO_MAX_SECONDS:180}
    audio-max-size-mb: ${AI_INTERVIEW_AUDIO_MAX_SIZE_MB:25}
    question-count: ${AI_INTERVIEW_QUESTION_COUNT:5}
    provider-connect-timeout-ms: ${AI_INTERVIEW_PROVIDER_CONNECT_TIMEOUT_MS:5000}
    provider-read-timeout-ms: ${AI_INTERVIEW_PROVIDER_READ_TIMEOUT_MS:20000}
    voice-streaming-enabled: ${AI_INTERVIEW_VOICE_STREAMING_ENABLED:true}
    voice-provider: ${AI_INTERVIEW_VOICE_PROVIDER:browser_web_speech}
    voice-silence-ms: ${AI_INTERVIEW_VOICE_SILENCE_MS:3000}
    voice-confirmation-silence-ms: ${AI_INTERVIEW_VOICE_CONFIRMATION_SILENCE_MS:3000}
    voice-unclear-confirmation-delay-ms: ${AI_INTERVIEW_VOICE_UNCLEAR_CONFIRMATION_DELAY_MS:1200}
    costly-requests-per-minute: ${AI_INTERVIEW_COSTLY_REQUESTS_PER_MINUTE:12}
  storage:
    cv-upload-dir: ${CV_UPLOAD_DIR:}
    avatar-upload-dir: ${AVATAR_UPLOAD_DIR:}
  payment:
    momo:
      enabled: ${MOMO_ENABLED:false}
      partner-code: ${MOMO_PARTNER_CODE:MOMO}
      access-key: ${MOMO_ACCESS_KEY:}
      secret-key: ${MOMO_SECRET_KEY:}
      endpoint: ${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
      sandbox: ${MOMO_SANDBOX:true}
    vnpay:
      enabled: ${VNPAY_ENABLED:false}
      tmn-code: ${VNPAY_TMN_CODE:}
      hash-secret: ${VNPAY_HASH_SECRET:}
      pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      api-url: ${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
      version: ${VNPAY_VERSION:2.1.0}
      sandbox: ${VNPAY_SANDBOX:true}
    bank-transfer:
      enabled: ${BANK_TRANSFER_ENABLED:false}
      bank-name: ${BANK_TRANSFER_BANK_NAME:}
      bank-code: ${BANK_TRANSFER_BANK_CODE:}
      account-number: ${BANK_TRANSFER_ACCOUNT_NUMBER:}
      account-name: ${BANK_TRANSFER_ACCOUNT_NAME:}
      branch: ${BANK_TRANSFER_BRANCH:}
      expire-minutes: ${BANK_TRANSFER_EXPIRE_MINUTES:15}
    payos:
      enabled: ${PAYOS_ENABLED:false}
      client-id: ${PAYOS_CLIENT_ID:}
      api-key: ${PAYOS_API_KEY:}
      checksum-key: ${PAYOS_CHECKSUM_KEY:}
      endpoint: ${PAYOS_ENDPOINT:https://api-merchant.payos.vn}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:demo}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
