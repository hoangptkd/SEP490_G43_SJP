spring:
  application:
    name: smart-recruitment-portal

  datasource:
    url: jdbc:postgresql://localhost:5432/smart_recruitment
    username: postgres
    password: hoang123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    com.sjp.recruitment: DEBUG
    org.springframework.security: INFO

jwt:
  secret: ${JWT_SECRET:your-secret-key-change-in-production-min-32-chars}
  expiration: 86400000
  refresh-expiration: 604800000